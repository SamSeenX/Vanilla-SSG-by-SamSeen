<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Bolt Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bgGrad)"/>

  <!-- Outer Frame -->
  <rect x="36" y="36" width="728" height="728" rx="28" fill="none" stroke="#1e293b" stroke-width="2"/>
  <rect x="48" y="48" width="704" height="704" rx="20" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Center Emblem (Circle with Lightning Bolt) -->
  <g transform="translate(400, 310)">
    <!-- Outer Glow Disk -->
    <circle cx="0" cy="0" r="140" fill="#1e293b" fill-opacity="0.6" stroke="#3b82f6" stroke-width="3" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="130" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>

    <!-- Inner Circle -->
    <circle cx="0" cy="0" r="110" fill="#1e293b" fill-opacity="0.8"/>

    <!-- Lightning Bolt Icon -->
    <g transform="translate(-100, -100) scale(2)">
      <path d="M55 15 L25 55 L48 55 L42 85 L75 45 L52 45 Z" fill="url(#boltGrad)" stroke="#93c5fd" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Brand Title -->
  <text x="400" y="540" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="56" font-weight="800" fill="#f8fafc" letter-spacing="-1">
    Vanilla<tspan fill="#3b82f6">SSG</tspan>
  </text>

  <!-- Divider -->
  <line x1="260" y1="575" x2="540" y2="575" stroke="#334155" stroke-width="2"/>
  <circle cx="400" cy="575" r="5" fill="#3b82f6"/>

  <!-- Subtitle -->
  <text x="400" y="620" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#94a3b8" letter-spacing="2">
    HIGH PERFORMANCE STATIC ARCHITECTURE
  </text>

  <!-- Feature Pills -->
  <text x="400" y="665" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#64748b" letter-spacing="1">
    Zero Hydration • Modular CSS • Automated SEO &amp; Linking
  </text>
</svg>
