<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0f151e"/>
      <stop offset="60%" stop-color="#080b10"/>
      <stop offset="100%" stop-color="#040608"/>
    </radialGradient>

    <!-- Lime Bolt Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bgGrad)"/>

  <!-- Outer Frame -->
  <rect x="36" y="36" width="728" height="728" rx="28" fill="none" stroke="#1c232e" stroke-width="2"/>
  <rect x="48" y="48" width="704" height="704" rx="20" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Center Emblem -->
  <g transform="translate(400, 310)">
    <!-- Outer Disk -->
    <circle cx="0" cy="0" r="140" fill="#0d1218" fill-opacity="0.8" stroke="#22c55e" stroke-width="2.5" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="130" fill="#080b10" stroke="#1c232e" stroke-width="2"/>
    <circle cx="0" cy="0" r="110" fill="#0e131a" fill-opacity="0.9"/>

    <!-- Lightning Bolt Icon -->
    <g transform="translate(-100, -100) scale(2)">
      <path d="M55 15 L25 55 L48 55 L42 85 L75 45 L52 45 Z" fill="url(#boltGrad)" stroke="#86efac" stroke-width="1"/>
    </g>

    <!-- Signal Orange Spark -->
    <circle cx="58" cy="-58" r="9" fill="#f97316"/>
  </g>

  <!-- Brand Title -->
  <text x="400" y="540" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="800" fill="#f8fafc" letter-spacing="-1">
    Vanilla<tspan fill="#22c55e">SSG</tspan>
  </text>

  <!-- Divider with Orange Dot -->
  <line x1="260" y1="575" x2="540" y2="575" stroke="#1c232e" stroke-width="2"/>
  <circle cx="400" cy="575" r="5" fill="#f97316"/>

  <!-- Subtitle -->
  <text x="400" y="620" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#94a3b8" letter-spacing="2">
    ZERO-HYDRATION STATIC SPEC
  </text>

  <!-- Feature Points -->
  <text x="400" y="665" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#64748b" letter-spacing="1">
    Pure HTML • Sub-200 Lines • $0/mo Cloudflare Edge
  </text>
</svg>
