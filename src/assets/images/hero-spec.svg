<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070a"/>
      <stop offset="50%" stop-color="#0a0f18"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>

    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="limeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Blueprint Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161f2e" stroke-width="1" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Deep Obsidian Canvas -->
  <rect width="1600" height="900" fill="url(#bgGrad)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <!-- Radial Glow Orbs -->
  <circle cx="800" cy="380" r="320" fill="#22c55e" opacity="0.12" filter="url(#limeGlow)"/>
  <circle cx="1200" cy="220" r="180" fill="#f97316" opacity="0.08" filter="url(#limeGlow)"/>

  <!-- Spec Outer Frame -->
  <rect x="80" y="60" width="1440" height="780" rx="16" fill="none" stroke="#1c2533" stroke-width="2"/>
  <rect x="96" y="76" width="1408" height="748" rx="12" fill="none" stroke="#22c55e" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="8 6"/>

  <!-- Top Hardware Bar -->
  <rect x="80" y="60" width="1440" height="50" rx="16" fill="#0c121c"/>
  <circle cx="120" cy="85" r="7" fill="#ef4444" opacity="0.8"/>
  <circle cx="145" cy="85" r="7" fill="#eab308" opacity="0.8"/>
  <circle cx="170" cy="85" r="7" fill="#22c55e" opacity="0.8"/>

  <text x="800" y="92" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', monospace" font-size="13" font-weight="600" fill="#64748b" letter-spacing="3">
    VANILLASSG // HIGH-EFFICIENCY ZERO-HYDRATION ARCHITECTURE SPEC
  </text>

  <!-- Central Kinetic Emblem -->
  <g transform="translate(800, 350)">
    <circle cx="0" cy="0" r="140" fill="#0b1017" stroke="#1f2937" stroke-width="3"/>
    <circle cx="0" cy="0" r="115" fill="#070a0e" stroke="#22c55e" stroke-width="2" stroke-opacity="0.5"/>
    <!-- Lightning Bolt -->
    <path d="M12 -70 L-50 10 L-6 10 L-18 70 L54 -6 L10 -6 Z" fill="url(#limeGrad)"/>
    <circle cx="48" cy="-52" r="9" fill="url(#orangeGrad)"/>
  </g>

  <!-- Typography -->
  <text x="800" y="565" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="900" fill="#ffffff" letter-spacing="-1">
    Vanilla<tspan fill="#22c55e">SSG</tspan> Architecture
  </text>

  <text x="800" y="615" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500" fill="#94a3b8">
    Zero-Hydration Static Engine • Vite Native • 100/100 Core Web Vitals
  </text>

  <!-- Spec Metrics Cards Bottom Bar -->
  <g transform="translate(260, 670)">
    <!-- Metric 1 -->
    <rect x="0" y="0" width="320" height="90" rx="8" fill="#0d1420" stroke="#1e293b" stroke-width="1.5"/>
    <text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', monospace" font-size="12" fill="#64748b" font-weight="600">FIRST CONTENTFUL PAINT</text>
    <text x="24" y="70" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', monospace" font-size="28" fill="#22c55e" font-weight="800">0.2s</text>
    <text x="110" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#64748b">Instant Edge</text>

    <!-- Metric 2 -->
    <rect x="380" y="0" width="320" height="90" rx="8" fill="#0d1420" stroke="#1e293b" stroke-width="1.5"/>
    <text x="404" y="36" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', monospace" font-size="12" fill="#64748b" font-weight="600">CLIENT JS OVERHEAD</text>
    <text x="404" y="70" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', monospace" font-size="28" fill="#22c55e" font-weight="800">0 KB</text>
    <text x="500" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#64748b">Zero Hydration</text>

    <!-- Metric 3 -->
    <rect x="760" y="0" width="320" height="90" rx="8" fill="#0d1420" stroke="#1e293b" stroke-width="1.5"/>
    <text x="784" y="36" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', monospace" font-size="12" fill="#64748b" font-weight="600">RESPONSIVE PAYLOAD</text>
    <text x="784" y="70" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', monospace" font-size="28" fill="#f97316" font-weight="800">22 KB</text>
    <text x="895" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#64748b">AVIF / WebP</text>
  </g>
</svg>
