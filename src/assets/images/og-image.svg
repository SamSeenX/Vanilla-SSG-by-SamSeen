<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070a"/>
      <stop offset="60%" stop-color="#0a0f18"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>

    <!-- Kinetic Lime Gradient -->
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#161f2e" stroke-width="1" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Canvas & Blueprint Grid -->
  <rect width="1200" height="630" fill="url(#ogBg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Radial Glow -->
  <circle cx="200" cy="220" r="180" fill="#22c55e" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1020" cy="460" r="140" fill="#f97316" opacity="0.08" filter="url(#glow)"/>

  <!-- Spec Outer Frame -->
  <rect x="36" y="36" width="1128" height="558" rx="16" fill="none" stroke="#1c2533" stroke-width="2"/>
  <rect x="48" y="48" width="1104" height="534" rx="12" fill="none" stroke="#22c55e" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="6 4"/>

  <!-- Top Metadata Bar -->
  <rect x="80" y="80" width="180" height="34" rx="6" fill="#f97316" fill-opacity="0.12" stroke="#f97316" stroke-width="1" stroke-opacity="0.4"/>
  <text x="170" y="102" fill="#f97316" font-family="ui-monospace, monospace" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="2">
    OPEN SOURCE SPEC
  </text>

  <text x="1120" y="103" fill="#64748b" font-family="ui-monospace, monospace" font-size="14" font-weight="600" text-anchor="end" letter-spacing="1">
    GITHUB // SAMSEENX / VANILLA-SSG
  </text>

  <!-- Central Title & Brand -->
  <g transform="translate(80, 230)">
    <!-- Lightning Bolt Icon -->
    <circle cx="50" cy="50" r="46" fill="#0b1017" stroke="#1f2937" stroke-width="2"/>
    <path d="M54 22 L26 56 L46 56 L40 84 L74 48 L52 48 Z" fill="url(#limeGrad)"/>
    <circle cx="70" cy="32" r="5" fill="#f97316"/>

    <text x="120" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1">
      Vanilla<tspan fill="#22c55e">SSG</tspan> Starter
    </text>

    <text x="120" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500" fill="#94a3b8">
      High performance, zero-hydration static site generator built with Vite.
    </text>
  </g>

  <!-- Metric Badges Row -->
  <g transform="translate(80, 420)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="220" height="74" rx="8" fill="#0d1420" stroke="#1e293b" stroke-width="1.5"/>
    <text x="20" y="30" font-family="ui-monospace, monospace" font-size="11" fill="#64748b" font-weight="600">LIGHTHOUSE SCORE</text>
    <text x="20" y="58" font-family="ui-monospace, monospace" font-size="24" fill="#22c55e" font-weight="800">100 / 100</text>

    <!-- Badge 2 -->
    <rect x="250" y="0" width="220" height="74" rx="8" fill="#0d1420" stroke="#1e293b" stroke-width="1.5"/>
    <text x="270" y="30" font-family="ui-monospace, monospace" font-size="11" fill="#64748b" font-weight="600">EDGE HOSTING</text>
    <text x="270" y="58" font-family="ui-monospace, monospace" font-size="24" fill="#22c55e" font-weight="800">$0 / Month</text>

    <!-- Badge 3 -->
    <rect x="500" y="0" width="220" height="74" rx="8" fill="#0d1420" stroke="#1e293b" stroke-width="1.5"/>
    <text x="520" y="30" font-family="ui-monospace, monospace" font-size="11" fill="#64748b" font-weight="600">CLIENT RUNTIME</text>
    <text x="520" y="58" font-family="ui-monospace, monospace" font-size="24" fill="#22c55e" font-weight="800">0 KB JS</text>

    <!-- Badge 4 -->
    <rect x="750" y="0" width="280" height="74" rx="8" fill="#0d1420" stroke="#1e293b" stroke-width="1.5"/>
    <text x="770" y="30" font-family="ui-monospace, monospace" font-size="11" fill="#64748b" font-weight="600">IMAGE PAYLOAD</text>
    <text x="770" y="58" font-family="ui-monospace, monospace" font-size="24" fill="#f97316" font-weight="800">97% Bandwidth Saved</text>
  </g>

  <!-- Spec Footer Rule -->
  <line x1="80" y1="535" x2="1120" y2="535" stroke="#1c232e" stroke-width="1"/>
  <text x="80" y="565" fill="#64748b" font-family="ui-monospace, monospace" font-size="13" font-weight="500">
    Pure HTML • Sub-200 Lines • Zero Framework Lock-In • MIT Licensed
  </text>
  <text x="1120" y="565" fill="#22c55e" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="end">
    ssg.samseen.dev
  </text>
</svg>
